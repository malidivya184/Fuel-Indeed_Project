<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: url('./images/fuel1.png') no-repeat center center fixed;
            background-size: cover;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
        }
        .dashboard {
            width: 250px;
            background-color: rgba(51, 51, 51, 0.9); /* Slight transparency */
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding-top: 20px;
            position: fixed;
        }
        .sidebar_user_info {
            text-align: center;
            margin-bottom: 20px;
            padding: 20px 0;
            border-bottom: 1px solid #575757;
        }
        .user_profle_side {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .user_img img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid #fff;
        }
        .user_info {
            margin-top: 10px;
            text-align: center;
        }
        .user_info h6 {
            margin: 0;
            font-size: 16px;
        }
        .user_info p {
            margin: 5px 0 0;
            font-size: 14px;
        }
        .user_info .online_animation {
            display: inline-block;
            width: 10px;
            height: 10px;
            background-color: #4caf50;
            border-radius: 50%;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% {
                transform: scale(0.9);
                opacity: 0.7;
            }
            100% {
                transform: scale(1.2);
                opacity: 1;
            }
        }
        .dashboard .menu-item {
            padding: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            transition: background-color 0.3s ease;
        }
        .dashboard .menu-item:hover {
            background-color: #575757;
        }  
        .dashboard .menu-item a {
            color: #fff; 
            text-decoration: none;
            width: 100%;
            display: flex;
            align-items: center;
        }
        .dashboard .menu-item i {
            margin-right: 10px;
        }
        .dashboard .menu-item span {
            font-size: 18px;
        }
        .menu-item span {
            position: relative;
            animation: fadeIn 1s ease-in-out;
        }
        @keyframes fadeIn {
            0% { opacity: 0; left: -10px; }
            100% { opacity: 1; left: 0; }
        }
        .content {
            margin-left: 250px; 
            padding: 20px;
            background-color: rgba(224, 224, 224, 0.9); /* Slight transparency for readability */
        }
        .navbar {
            background-color: rgba(51, 51, 51, 0.9); 
            color: #fff;
            display: flex;
            justify-content: space-around;
            padding: 15px;
            position: fixed;
            top: 0;
            left: 250px; 
            width: calc(100% - 250px);
            z-index: 1000;
        }
        .navbar a {
            color: #fff;
            text-decoration: none;
            font-size: 18px;
            transition: color 0.3s ease;
        }
        .navbar a:hover {
            color: #4caf50;
        }
        .navbar .nav-item {
            display: flex;
            align-items: center;
        }
        .navbar .nav-item i {
            margin-right: 5px;
        }
        .main-content {
            margin-top: 70px; 
             text-align: center;
            
        }
        .main-content h1 {
            color: #333;
             text-align: center;
        }
        .info-box {
            background: #fff;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            max-width: 600px;
            margin: 0 auto;
            text-align: center;
        }
        .info-box p {
            font-size: 16px;
            color: #666;
            line-height: 1.7;
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="sidebar_user_info">
            <div class="user_profle_side">
                <div class="user_img">
                     <img class="img-responsive" src="./images/image1.png" alt="User Image">
                </div>
                <div class="user_info">
                    <h6>Fuel Booking Platform</h6>
                    <p><span class="online_animation"></span> Online</p>
                </div>
            </div>
        </div>

        <!-- Sidebar Menu Items with Icons -->
        <div >
                <i class="fas fa-tachometer-alt"></i>
                <span>Menu</span>
            </a>
        </div>
        <div class="menu-item">
            <a href="pending_fuel_station.jsp">
                <i class="fas fa-clock"></i>
                <span>Pending Fuel Station</span>
            </a>
        </div>
        <div class="menu-item">
            <a href="view_Approved_fuel_station.jsp">
                <i class="fas fa-check-circle"></i>
                <span>Approved Fuel Station</span>
            </a>
        </div>
        <div class="menu-item">
            <a href="view_Disapproved_fuel_Station.jsp">
                <i class="fas fa-times-circle"></i>
                <span>Disapproved Fuel Station</span>
            </a>
        </div>
        <div class="menu-item">
            <a href="View_user.jsp">
                <i class="fas fa-users"></i>
                <span>View Users</span>
            </a>
        </div>
        <div class="menu-item">
            <a href="index.html">
                <i class="fas fa-sign-out-alt"></i>
                <span>Logout</span>
            </a>
        </div>
    </div>

    

    <div class="content">
        <div class="main-content">
            <!-- Main content goes here -->
            <h1>Welcome Admin!!!</h1>
        </div>
    </div>
</body>
</html>
