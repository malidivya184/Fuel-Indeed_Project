<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Delivered</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #eaf7e8;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .success-container {
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 500px;
            width: 100%;
            margin: 20px;
        }
        .success-container h1 {
            font-size: 2.5em;
            color: #27ae60;
            margin: 0;
        }
        .success-container p {
            font-size: 1.2em;
            color: #333;
            margin: 20px 0;
        }
        .success-container .icon {
            font-size: 4em;
            color: #27ae60;
        }
        .success-container a {
            color: #3498db;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.2em;
        }
        .success-container a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="success-container">
        <div class="icon">
            <i class="fas fa-check-circle"></i>
        </div>
        <h1>Successfully Delivered!</h1>
        <p>Your order has been successfully delivered. Thank you for choosing our service!</p>
        <a href="delivery_person_dashboard.html">Return to Home</a>
    </div>
</body>
</html>
